; PlatformIO project — 实战派 ESP32-S3 on-chip FFT spectrum analyzer
; RF capture backend adapted from ESPARGOS/esp-sdr (ESP32-S3 target).

[platformio]
src_dir = main

[env:szp-s3-rf]
platform = espressif32 @ 6.6.0
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.partitions = partitions.csv
build_flags =
	-DSZP_S3_RF=1
